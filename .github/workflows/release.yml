name: Release image

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # -> ghcr.io/confusinguser/rustcast
  IMAGE_NAME: ${{ github.repository_owner }}/rustcast

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Per-arch tag prefix the manifest job stitches together: the release version,
      # or `sha-<short commit>` for a plain push / manual run.
      - name: Resolve tag prefix
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            echo "prefix=${v#v}" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native build (runs-on already matches the target arch), so no platforms:/
      # QEMU. Cache is scoped per arch so the two runners don't clobber each other.
      - name: Build & push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.prefix }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Combine the two per-arch images into multi-arch manifest lists.
  manifest:
    name: multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
            echo "prefix=$v" >> "$GITHUB_OUTPUT"
            echo "tags=$v ${v%.*} latest" >> "$GITHUB_OUTPUT"
          else
            p="sha-${GITHUB_SHA::7}"
            echo "prefix=$p" >> "$GITHUB_OUTPUT"
            echo "tags=$p" >> "$GITHUB_OUTPUT"
          fi

      - name: Create & push manifest lists
        run: |
          base="$REGISTRY/$IMAGE_NAME"
          amd="$base:${{ steps.v.outputs.prefix }}-amd64"
          arm="$base:${{ steps.v.outputs.prefix }}-arm64"
          for tag in ${{ steps.v.outputs.tags }}; do
            docker buildx imagetools create -t "$base:$tag" "$amd" "$arm"
          done
